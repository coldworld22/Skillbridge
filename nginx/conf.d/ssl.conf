server {
    listen 443 ssl;
    server_name eduskillbridge.net www.eduskillbridge.net;

    ssl_certificate /etc/letsencrypt/live/eduskillbridge.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduskillbridge.net/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        # keep the /api prefix when forwarding to the backend exactly
        # $request_uri preserves query strings after OAuth redirects
        proxy_pass http://backend:5002$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
