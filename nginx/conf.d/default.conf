server {
  listen 80;
  server_name eduskillbridge.net www.eduskillbridge.net;
  # allow up to 100 MB uploads to avoid 413 errors
  client_max_body_size 100M;

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # always send CORS headers so browsers see them even on errors
    add_header 'Access-Control-Allow-Origin' 'https://eduskillbridge.net' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
  }

  location ^~ /api/ {
    # forward API requests without rewriting the path
    proxy_pass http://backend:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
