server {
  listen 80;
  listen [::]:80;
  server_name eduskillbridge.net www.eduskillbridge.net api.eduskillbridge.net whatsappapi.eduskillbridge.net;

  client_max_body_size 500M;

  return 301 https://$host$request_uri;
}

# Fallback catch-all for unexpected hosts to avoid infinite restart loops.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}
