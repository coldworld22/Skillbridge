<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillBridge Installer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>SkillBridge Installation</h1>
  <section id="step1" class="section">
    <h2>Step 1: Prerequisite Check</h2>
    <button id="checkBtn" class="btn">Recheck</button>
    <pre id="prereqOutput" class="output"></pre>
  </section>
  <section id="step2" class="section" style="display: none;">
    <h2>Step 2: Configuration</h2>
    <form id="configForm">
      <label>
        Admin Email
        <input type="email" name="adminEmail" required />
      </label>
      <br />
      <label>
        Admin Password
        <input type="password" name="adminPassword" required />
      </label>
      <br />
      <button type="submit" class="btn">Run Install</button>
    </form>
    <pre id="installOutput" class="output"></pre>
  </section>
  <script src="install.js" defer></script>
</body>
</html>
