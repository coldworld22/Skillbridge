name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
          POSTGRES_DB: skillbridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skillbridge" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://skillbridge:skillbridge@localhost:5432/skillbridge_test
      DATABASE_URL: postgres://skillbridge:skillbridge@localhost:5432/skillbridge_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      SESSION_SECRET: ci-only-session-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Run migrations
        run: npx knex migrate:latest --env test
      - name: Run tests
        run: npm test -- --coverage
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Run tests
        run: npm test -- --coverage --ci --forceExit
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
